name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/Pro-Mini-Keyboard-v2.0.0.apk \;
          ls -lah output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Mini-Keyboard-v2.0.0.apk
          path: output/Pro-Mini-Keyboard-v2.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0
          name: "Pro Mini Keyboard v2.0.0 (V2 Premium + Session Clipboard)"
          body: |
            ## Pro Mini Keyboard v2.0.0 🚀
            
            Major upgrade with **Premium Tablet UI** and **In-Memory Session Clipboard Manager**.
            
            ### ✨ What's New in V2:
            - **Centre Panel Clipboard Manager**:
              - In-memory session-only storage (Max 20 entries, no DB/no files).
              - Pin/Unpin controls (pinned clips always stay on top).
              - Individual item deletion & Clear All with confirmation.
              - Instant paste on clip tap without stealing editor focus.
              - Sensitive clipboard protection (skips passwords/OTPs on Android 13+).
              - Neat empty state when no items are copied.
            - **High-Contrast Premium Tablet UI**:
              - Dark charcoal/navy `#0F172A` with slate panels and vibrant cyan `#06B6D4` accents.
              - 8dp/10dp rounded corners, consistent touch targets, high contrast.
            - **Smart Paste**:
              - Pastes selected clip, newest clip, or falls back to system clipboard.
            - **Professional App Branding**:
              - Custom vector launcher icon with keyboard silhouette and cyan checkmark detail.
            - **Preserved Core Editing & Navigation**:
              - Left Panel (25%): Copy, Cut, Delete, Undo (Ctrl+Z), Redo (Ctrl+Shift+Z).
              - Right Panel (30%): Select All, Paste, DPAD Navigation (◀ ▲ ▼ ▶), Enter.
              - Silent & Fast: Zero typing bloat, zero haptics, zero click sound.
          files: output/Pro-Mini-Keyboard-v2.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
