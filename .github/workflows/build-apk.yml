name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/Pro-Mini-Keyboard-v1.0.0.apk \;
          ls -lah output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Mini-Keyboard-v1.0.0.apk
          path: output/Pro-Mini-Keyboard-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Pro Mini Keyboard v1.0.0"
          body: |
            ## Pro Mini Keyboard v1.0.0 🚀
            
            Lightweight, high-performance native Android Productivity Keyboard (`InputMethodService`).
            
            ### ✨ Features:
            - **Left Panel (25%)**: Copy, Cut, Delete, Undo (Ctrl+Z), Redo (Ctrl+Shift+Z)
            - **Center Panel (45%)**: One-tap Switch Keyboard (`showInputMethodPicker()`)
            - **Right Panel (30%)**: Select All, Paste, DPAD Navigation (◀ ▲ ▼ ▶), Enter
            - **Zero Bloat**: No background telemetry, no typing key lag, haptic feedback and click sounds disabled.
            
            ### 📲 Installation:
            1. Download `Pro-Mini-Keyboard-v1.0.0.apk` below.
            2. Install the APK on your Android device or emulator.
            3. Enable in **Settings → System → Languages & input → On-screen keyboard → Manage on-screen keyboards**.
            4. Switch to **Productivity Keyboard** in any editor!
          files: output/Pro-Mini-Keyboard-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
