name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Pro-Mini-Keyboard-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Mini-Keyboard-APK
          path: output/Pro-Mini-Keyboard-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Pro Mini Keyboard v1.0.0"
          body: |
            ## Pro Mini Keyboard v1.0.0
            Minimal Android Productivity Keyboard (InputMethodService).
            
            ### Included Features:
            - **Editing Panel (25%)**: Copy, Cut, Delete, Undo (Ctrl+Z), Redo (Ctrl+Shift+Z)
            - **Center Switcher (45%)**: One-tap Switch Keyboard (`showInputMethodPicker()`)
            - **Navigation Panel (30%)**: Select All, Paste, DPAD Navigation (Left, Up, Down, Right), Enter
            - **Clean & Fast**: Zero typing bloat, zero haptics, zero sound effects.
            
            Download the APK below and install on your Android device!
          files: output/Pro-Mini-Keyboard-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
